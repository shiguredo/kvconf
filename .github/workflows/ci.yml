name: ci

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # prek.toml のフックをすべて実行する (efmt / efmt-check / elint など)
  check:
    runs-on: ubuntu-slim
    # prek の hook 環境準備 (初回や cache miss) を見込んで余裕を持たせる
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/shiguredo/erlang:otp-29.0.6-aws-lc-v5.8.0-ubuntu-26.04-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make compile dialyzer test

  notify:
    needs: [check, ci]
    if: always()
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_channel: ${{ secrets.SLACK_INTERNAL_CHANNEL }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
