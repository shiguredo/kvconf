name: ci

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  efmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # gh release download で使用する
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EFMT_VERSION: "0.21.0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # "Install efmt" の中でパスを追加しても反映されなかったのでステップを分ける
      - name: Add path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install efmt
        run: |
          gh release download "${EFMT_VERSION}" \
            -R sile/efmt \
            -p "efmt-${EFMT_VERSION}.x86_64-unknown-linux-musl" \
            -D .
          chmod 755 "efmt-${EFMT_VERSION}.x86_64-unknown-linux-musl"
          mkdir -p "$HOME/.local/bin"
          mv "efmt-${EFMT_VERSION}.x86_64-unknown-linux-musl" "$HOME/.local/bin/efmt"

      - name: Verify efmt
        run: efmt --version

      - run: make efmt-check

  # プリビルドバイナリが無いため cargo install で導入する
  elint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELINT_VERSION: "0.0.2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Add path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Install elint
        run: cargo install elint --version "${ELINT_VERSION}" --locked

      - name: Verify elint
        run: elint --version

      - run: make elint-check

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/shiguredo/erlang:otp-29.0.2-aws-lc-v5.2.0-ubuntu-26.04-x86_64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make compile dialyzer test

  notify:
    needs: [efmt, elint, ci]
    if: always()
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_channel: ${{ secrets.SLACK_INTERNAL_CHANNEL }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
